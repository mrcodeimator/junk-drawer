<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420">
  <defs>
    <style>
      .bg { fill: #141416; }
      .dialog { fill: #252525; stroke: #444444; stroke-width: 1.5; rx: 10; }
      .tree { fill: #1b1b1b; stroke: #383838; stroke-width: 1; rx: 6; }
      .row-selected { fill: #2d5aa0; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #f0f0f0; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; fill: #cccccc; }
      .tree-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #dddddd; }
      .bold { font-weight: 700; fill: #ffffff; }
      .input-box { fill: #141414; stroke: #4c8bf5; stroke-width: 2; rx: 4; }
      .btn { fill: #383838; stroke: #555555; stroke-width: 1; rx: 5; }
      .btn-primary { fill: #4c8bf5; rx: 5; }
      .btn-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; fill: #ffffff; }
      .callout-circle { fill: #ff5252; }
      .callout-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 12.5px; fill: #ffffff; font-weight: 600; }
    </style>
  </defs>

  <rect width="820" height="420" rx="16" class="bg" />

  <!-- Photoshop Keyboard Shortcuts Dialog Mockup -->
  <rect x="30" y="24" width="760" height="372" class="dialog" />
  <rect x="30" y="24" width="760" height="34" rx="10" fill="#303030" />
  <text x="48" y="46" class="title">Keyboard Shortcuts and Menus (Edit ’ Keyboard Shortcuts&)</text>

  <!-- Shortcuts For Dropdown -->
  <text x="52" y="84" class="label">Shortcuts For:</text>
  <rect x="145" y="66" width="210" height="26" class="btn" />
  <text x="157" y="84" class="tree-text">Application Menus   ¾</text>

  <!-- Left Tree Table -->
  <rect x="52" y="106" width="540" height="266" class="tree" />
  <rect x="52" y="106" width="540" height="28" fill="#2c2c2c" />
  <text x="68" y="125" class="label bold">Application Menu Command</text>
  <text x="380" y="125" class="label bold">Shortcut</text>

  <!-- Tree items -->
  <text x="68" y="156" class="tree-text">¾ File</text>
  <text x="88" y="182" class="tree-text">New&</text>
  <text x="88" y="206" class="tree-text">Open&</text>
  <text x="88" y="232" class="tree-text">¾ Scripts</text>
  <circle cx="72" cy="227" r="12" class="callout-circle" />
  <text x="72" y="227" class="callout-num">1</text>

  <text x="112" y="258" class="tree-text">Image Processor&</text>
  <text x="112" y="282" class="tree-text">Delete All Empty Layers</text>

  <!-- Selected Junk Drawer Row -->
  <rect x="53" y="294" width="538" height="34" class="row-selected" />
  <text x="112" y="316" class="tree-text bold">Junk Drawer</text>

  <!-- Shortcut Input Box -->
  <rect x="372" y="298" width="196" height="26" class="input-box" />
  <text x="384" y="316" class="code">Ctrl + Shift + Space</text>
  <circle cx="568" cy="298" r="12" class="callout-circle" />
  <text x="568" y="298" class="callout-num">2</text>

  <!-- Right Side Buttons in Dialog -->
  <rect x="616" y="72" width="148" height="32" class="btn-primary" />
  <text x="675" y="93" class="btn-text">OK</text>
  <circle cx="764" cy="72" r="12" class="callout-circle" />
  <text x="764" y="72" class="callout-num">4</text>

  <rect x="616" y="114" width="148" height="30" class="btn" />
  <text x="668" y="134" class="btn-text">Cancel</text>

  <rect x="616" y="220" width="148" height="32" class="btn-primary" />
  <text x="667" y="241" class="btn-text">Accept</text>
  <circle cx="764" cy="220" r="12" class="callout-circle" />
  <text x="764" y="220" class="callout-num">3</text>

  <!-- Legend Bar at Bottom -->
  <text x="616" y="290" class="label bold">Quick Steps:</text>
  <text x="616" y="312" class="label">1. Expand <tspan class="bold">File ’ Scripts</tspan></text>
  <text x="616" y="332" class="label">2. Press <tspan class="bold">Ctrl+Shift+Space</tspan></text>
  <text x="616" y="352" class="label">3. Click <tspan class="bold">Accept</tspan>, then <tspan class="bold">OK</tspan></text>
</svg>
