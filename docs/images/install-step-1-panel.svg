<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440">
  <defs>
    <style>
      .bg { fill: #141416; }
      .panel { fill: #1e1e1e; stroke: #3a3a3a; stroke-width: 1.5; rx: 12; }
      .card { fill: #2a2a2a; stroke: #3d3d3d; stroke-width: 1; rx: 8; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #f0f0f0; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #9a9a9a; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #d8d8d8; }
      .bold { font-weight: 700; fill: #ffffff; }
      .btn-primary { fill: #4c8bf5; rx: 6; }
      .btn-secondary { fill: #323232; stroke: #4a4a4a; stroke-width: 1; rx: 6; }
      .btn-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; }
      .badge { fill: #2a2a2a; stroke: #3a3a3a; stroke-width: 1; rx: 4; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #9a9a9a; }
      .callout-circle { fill: #ff5252; }
      .callout-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .callout-box { fill: #232730; stroke: #4c8bf5; stroke-width: 1.5; rx: 8; }
      .code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; fill: #8ab4f8; }
      .link { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #4c8bf5; text-decoration: underline; }
    </style>
  </defs>

  <rect width="820" height="440" rx="16" class="bg" />

  <!-- Left: Photoshop Panel Mockup -->
  <rect x="32" y="28" width="430" height="384" class="panel" />
  <rect x="32" y="28" width="430" height="32" rx="12" fill="#282828" />
  <text x="48" y="49" class="badge-text" style="fill:#bdbdbd;font-weight:600;">Plugins ’ Junk Drawer ’ Junk Drawer</text>

  <!-- Panel Header -->
  <text x="54" y="86" class="title">Junk Drawer</text>
  <rect x="394" y="70" width="48" height="22" class="badge" />
  <text x="403" y="85" class="badge-text">v0.9.1</text>

  <text x="54" y="108" class="subtitle">Quick search for Filters, Adjustments, and Layer Styles.</text>

  <!-- Action Buttons -->
  <rect x="54" y="122" width="112" height="32" class="btn-primary" />
  <text x="71" y="143" class="btn-text">Open Search</text>

  <rect x="176" y="122" width="144" height="32" class="btn-secondary" />
  <text x="193" y="143" class="btn-text">Set Up Shortcut&</text>

  <!-- Callout 1 badge -->
  <circle cx="320" cy="122" r="13" class="callout-circle" />
  <text x="320" y="122" class="callout-num">1</text>

  <!-- Setup Walkthrough Card -->
  <rect x="54" y="168" width="386" height="190" class="card" />
  <text x="70" y="192" class="body bold">Shortcut Setup Walkthrough</text>
  <text x="416" y="192" class="subtitle"></text>

  <text x="70" y="216" class="body" style="font-size:12px;">1. Click <tspan class="bold">Save Shortcut File&</tspan> to install <tspan class="code">Junk Drawer.jsx</tspan></text>
  <text x="84" y="233" class="subtitle" style="font-size:11.5px;">into Photoshop's Presets/Scripts folder.</text>
  <text x="70" y="255" class="body" style="font-size:12px;">2. <tspan class="bold">Restart Photoshop</tspan> so it loads the new script.</text>
  <text x="70" y="277" class="body" style="font-size:12px;">3. Click <tspan class="bold">Open Keyboard Shortcuts</tspan> and assign</text>
  <text x="84" y="294" class="code">Ctrl+Shift+Space</text>

  <!-- Walkthrough Buttons -->
  <rect x="70" y="312" width="162" height="30" class="btn-primary" />
  <text x="84" y="331" class="btn-text" style="font-size:12px;">1. Save Shortcut File&</text>
  <circle cx="232" cy="312" r="13" class="callout-circle" />
  <text x="232" y="312" class="callout-num">2</text>

  <rect x="244" y="312" width="180" height="30" class="btn-secondary" />
  <text x="255" y="331" class="btn-text" style="font-size:12px;">2. Open Keyboard Shortcuts</text>
  <circle cx="424" cy="312" r="13" class="callout-circle" />
  <text x="424" y="312" class="callout-num">3</text>

  <!-- Footer -->
  <line x1="54" y1="372" x2="440" y2="372" stroke="#3a3a3a" stroke-width="1" />
  <text x="54" y="394" class="subtitle" style="fill:#66bb6a;font-size:12px;"> Shortcut script installed</text>
  <text x="352" y="394" class="link">Send Feedback</text>

  <!-- Right Side Explanations -->
  <rect x="490" y="52" width="298" height="96" class="callout-box" />
  <circle cx="516" cy="80" r="13" class="callout-circle" />
  <text x="516" y="80" class="callout-num">1</text>
  <text x="538" y="84" class="body bold">Open the Setup Wizard</text>
  <text x="506" y="108" class="subtitle">In Photoshop, open <tspan class="bold">Plugins ’ Junk Drawer</tspan></text>
  <text x="506" y="126" class="subtitle">and click <tspan class="bold">Set Up Shortcut&</tspan></text>

  <rect x="490" y="168" width="298" height="106" class="callout-box" />
  <circle cx="516" cy="196" r="13" class="callout-circle" />
  <text x="516" y="196" class="callout-num">2</text>
  <text x="538" y="200" class="body bold">Install the Helper Script</text>
  <text x="506" y="224" class="subtitle">Click <tspan class="bold">1. Save Shortcut File&</tspan> It auto-installs</text>
  <text x="506" y="242" class="subtitle">into <tspan class="code">Presets/Scripts</tspan> (or prompts you to save),</text>
  <text x="506" y="260" class="subtitle">then restart Photoshop once.</text>

  <rect x="490" y="294" width="298" height="96" class="callout-box" />
  <circle cx="516" cy="322" r="13" class="callout-circle" />
  <text x="516" y="322" class="callout-num">3</text>
  <text x="538" y="326" class="body bold">Launch Shortcut Settings</text>
  <text x="506" y="350" class="subtitle">Click <tspan class="bold">2. Open Keyboard Shortcuts</tspan> to jump</text>
  <text x="506" y="368" class="subtitle">straight to Photoshop's shortcut window.</text>
</svg>
